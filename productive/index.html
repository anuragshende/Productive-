<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productivity Dashboard</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body><header><div><h1>Productivity Dashboard</h1><p id="clock"></p></div><button id="theme">Toggle theme</button></header><main><section><h2>Todo List</h2><form id="tasks-form"><input aria-label="New task" placeholder="Add a task" maxlength="200" required><button>Add</button></form><ul id="tasks"></ul></section><section><h2>Daily Goals</h2><form id="goals-form"><input aria-label="New goal" placeholder="Add a goal" maxlength="200" required><button>Add</button></form><p id="progress" aria-live="polite"></p><ul id="goals"></ul></section><section><h2>Daily Planner</h2><p id="date"></p><div id="planner"></div></section><section><h2>Pomodoro Timer</h2><p id="session">Work session</p><div id="timer" role="timer">25:00</div><div class="controls"><button id="start">Start</button><button id="pause">Pause</button><button id="reset">Reset</button><button id="mode">Work / Break</button></div><p id="notice" role="status"></p></section><section><h2>Motivation</h2><blockquote id="quote"></blockquote><button id="new-quote">New prompt</button><p>Built-in prompts · no API required</p></section></main><footer id="storage" role="status">Data is saved in this browser.</footer></body></html>
